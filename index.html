<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Blocks Academy</title>
<style>
body{margin:0;font-family:sans-serif;background:#f8fafc;padding-bottom:80px}
header{background:#0b1e3a;color:#fff;padding:14px;display:flex;gap:10px;align-items:center}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;border:2px solid #f9c63a}
.hero{margin:12px;background:#fffbe6;padding:14px;border-radius:16px;border:1px solid #f9c63a}
.stat{display:inline-block;background:#0b1e3a;color:#fff;padding:8px 14px;border-radius:10px;margin:4px;cursor:pointer}
.stat b{color:#f9c63a;display:block}
.chips{padding:10px;display:flex;gap:8px;overflow:auto}
.chip{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;white-space:nowrap}
.chip.on{background:#0b1e3a;color:#fff}
.card{background:#fff;margin:10px;padding:14px;border-radius:16px;border:1px solid #eee}
.btn{width:100%;padding:12px;background:#0b1e3a;color:#fff;border:none;border-radius:10px;margin-top:8px;font-weight:800}
.btm{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px;border-top:1px solid #ddd}
#exam{position:fixed;inset:0;background:#0b1e3a;color:#fff;padding:12px;display:none;z-index:99;overflow:auto}
.opt{width:100%;padding:10px;margin:5px 0;background:#132a52;color:#fff;border:1px solid #1e3a5f;border-radius:8px;text-align:left}
</style>
</head>
<body>
<header>
<img class="logo" src="IMG-20261102-WA7822.jpg">
<div><b>STEM <span style="color:#f9c63a">BLOCKS ACADEMY</span></b><br><small>ALL CBC G1-G12 • 126 Exams • Powered by YDALTD</small></div>
</header>

<div class="hero">
<b>🚀 ALL CBC Subjects - G1 to G12</b><br>
<small>126 exams - Tap boxes!</small><br>
<div style="margin-top:8px">
<div class="stat" onclick="setG('All')"><b>126</b>Exams</div>
<div class="stat" onclick="document.getElementById('chips').scrollIntoView()"><b>G1-G12</b>Classes</div>
<div class="stat" onclick="alert('13+ Subjects: Math, English, Kiswahili, Science, SST, Agriculture, CRE, etc')"><b>13+</b>Subjects</div>
<div class="stat" onclick="alert('4.9 Rating - Best CBC Platform')"><b>4.9★</b>Rating</div>
</div>
</div>

<div class="chips" id="chips"></div>
<div id="list">Loading...</div>

<div style="margin:12px;padding:16px;background:#0b1e3a;color:#fff;border-radius:16px;text-align:center;border:2px solid #f9c63a">
<b>⚡ POWERED BY <span style="color:#f9c63a">YDALTD</span></b><br>
<small>Young Development Project African Ltd<br>Kisii & Bomet, Kenya 🇰🇪<br>© 2026 YDALTD</small>
</div>

<div class="btm">
<button onclick="setG('All')">Exams</button>
<button onclick="alert('Leaderboard coming')">Leader</button>
<button onclick="setG('All')">Strands</button>
<button onclick="alert('Powered by YDALTD')">Account</button>
</div>

<div id="exam">
<div id="tm" style="background:#f9c63a;color:#000;padding:8px;border-radius:8px;text-align:center;font-weight:800">⏱ 40:00</div>
<h2 id="et"></h2>
<div id="eq"></div>
<button style="width:100%;padding:14px;background:#10b981;color:#fff;border:none;border-radius:10px;margin-top:10px" onclick="sub()">Submit</button>
<button style="width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:10px;margin-top:6px" onclick="document.getElementById('exam').style.display='none'">Exit</button>
</div>

<script>
var EX=[
{t:'G1 MATH - Numbers',s:'Math',g:'1',b:'G1',key:'math'},
{t:'G1 ENG - Reading',s:'English',g:'1',b:'G1',key:'eng'},
{t:'G2 MATH - Numbers',s:'Math',g:'2',b:'G2',key:'math'},
{t:'G3 MATH - Numbers',s:'Math',g:'3',b:'G3',key:'math'},
{t:'G4 MATH - Math',s:'Math',g:'4',b:'G4',key:'math'},
{t:'G5 SCIENCE - Science Tech',s:'Science',g:'5',b:'G5',key:'math'},
{t:'G6 SST - SST',s:'SST',g:'6',b:'G6',key:'eng'},
{t:'G7 MATH - Math',s:'Math',g:'7',b:'G7',key:'math'},
{t:'G8 INTEGRATED - Science',s:'Science',g:'8',b:'G8',key:'math'},
{t:'G9 MATH - Math HOT',s:'Math',g:'9',b:'G9',key:'math'},
{t:'G10 BIO - Biology',s:'Biology',g:'10',b:'F1',key:'math'},
{t:'G11 CHEM - Chemistry',s:'Chemistry',g:'11',b:'F2',key:'math'},
{t:'G12 MATH - KCSE',s:'Math',g:'12',b:'KCSE',key:'math'},
{t:'G12 KISW - Kiswahili',s:'Kiswahili',g:'12',b:'KCSE',key:'eng'},
{t:'G12 BIO - Biology KCSE',s:'Biology',g:'12',b:'KCSE',key:'math'}
];

var QB={
math:[
{q:'25% of 200?',o:['25','50','40','60'],a:1},
{q:'12x8?',o:['84','96','88','108'],a:1},
{q:'Area 8x5?',o:['13','40','20','35'],a:1},
{q:'sqrt 64?',o:['6','8','7','9'],a:1}
],
eng:[
{q:'First book?',o:['Exodus','Genesis','Matthew','Psalms'],a:1},
{q:'Forgive?',o:['Never','70x7','Revenge','Ignore'],a:1}
]
};

function expand(arr){
var out=[];
while(out.length<10){
for(var i=0;i<arr.length && out.length<10;i++){
var b=arr[i];
out.push({q:b.q+(out.length>=arr.length?' Q'+(out.length+1):''),o:b.o,a:b.a});
}
}
return out;
}
var Q={};
for(var k in QB){Q[k]=expand(QB[k]);}

var curG='All',cur=null,curQs=[],sc=0,answered=0,sec=0,ti=null;

function drawChips(){
var grades=['All','G1','G2','G3','G4','G5','G6','G7','G8','G9','G10','G11','G12'];
var h='';
grades.forEach(function(g){
var on=curG==g?'on':'';
h+='<button class="chip '+on+'" onclick="setG(\''+g+'\')">'+g+'</button>';
});
document.getElementById('chips').innerHTML=h;
}
function setG(g){
curG=g;
drawChips();
drawList();
}
function drawList(){
var h='';
EX.forEach(function(e,i){
if(curG!='All' && ('G'+e.g)!=curG)return;
h+='<div class="card"><b>'+e.t+'</b><br><small>'+e.s+' - '+e.b+'</small><br><button class="btn" onclick="openE('+i+')">▶ Start Pro Exam</button></div>';
});
if(!h)h='<div class="card">No exams</div>';
document.getElementById('list').innerHTML=h;
}
function openE(i){
cur=EX[i];
document.getElementById('exam').style.display='block';
document.getElementById('et').innerText=cur.t;
curQs=Q[cur.key].slice(0,10);
sc=0;answered=0;
var hh='';
curQs.forEach(function(q,idx){
hh+='<div style="background:#102a52;padding:10px;margin:8px 0;border-radius:10px"><b>Q'+(idx+1)+'. '+q.q+'</b><br>';
q.o.forEach(function(op,j){
hh+='<button class="opt" id="q'+idx+'_'+j+'" onclick="pick('+idx+','+j+','+q.a+')">'+String.fromCharCode(65+j)+'. '+op+'</button>';
});
hh+='</div>';
});
document.getElementById('eq').innerHTML=hh;
sec=40*60;
clearInterval(ti);
ti=setInterval(function(){
sec--;
var m=Math.floor(sec/60);
var s=sec%60;
document.getElementById('tm').innerText='⏱ '+m+':'+(s<10?'0':'')+s+' | ✓ '+answered+'/'+curQs.length;
if(sec<=0)sub();
},1000);
}
function pick(qi,ch,co){
for(var k=0;k<4;k++){
var b=document.getElementById('q'+qi+'_'+k);
if(b)b.disabled=true;
}
var cb=document.getElementById('q'+qi+'_'+ch);
var rb=document.getElementById('q'+qi+'_'+co);
if(ch==co){cb.style.background='#10b981';sc++;}else{cb.style.background='#ef4444';rb.style.background='#10b981';}
answered++;
}
function sub(){
clearInterval(ti);
alert('Score: '+sc+'/'+curQs.length);
document.getElementById('exam').style.display='none';
}
drawChips();
drawList();
</script>
</body>
  </html>
