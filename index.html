<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEM Blocks PRO</title><style>*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;background:#f8fafc;padding-bottom:85px}header{background:linear-gradient(135deg,#0b1e3a,#1e3a5f);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}.logo{width:50px;height:50px;border-radius:50%;background:#fff;padding:2px;border:3px solid #f9c63a;object-fit:cover}h{font-weight:900}h span{color:#f9c63a}h small{display:block;font-size:10px;opacity:.8}.hero{background:linear-gradient(135deg,#fff,#fefce8);padding:14px;margin:12px;border-radius:18px;border:1px solid #fef08a}.hero-stats{display:flex;gap:8px;margin-top:8px}.stat{background:#0b1e3a;color:#fff;padding:8px;border-radius:10px;flex:1;text-align:center}.stat b{display:block;color:#f9c63a}.chips{display:flex;gap:8px;overflow:auto;padding:10px}.chip{padding:10px 16px;border-radius:24px;background:#fff;border:1px solid #e2e8f0;font-weight:700;white-space:nowrap;cursor:pointer}.chip.on{background:#0b1e3a;color:#fff}.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 4px 16px #0001;border:1px solid #f1f5f9;position:relative;overflow:hidden}.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}.b-yellow{background:#fef08a;color:#854d0e}.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#15803d}.btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:800;margin-top:10px;cursor:pointer}.btn-primary{background:#0b1e3a;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:8px 0;z-index:50}.btm{border:none;background:none;font-size:11px;font-weight:700;color:#94a3b8;padding:6px 14px;border-radius:12px;cursor:pointer}.btm.on{background:#fef08a;color:#0b1e3a;border:1px solid #f9c63a}.tab{display:none}.tab.on{display:block}#exam{position:fixed;inset:0;background:#0b1e3a;color:#fff;padding:12px;display:none;z-index:99;overflow:auto}.opt{width:100%;text-align:left;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #1e3a5f;background:#132a52;color:#fff;font-weight:600;cursor:pointer}.opt.correct{background:#10b981!important}.opt.wrong{background:#ef4444!important}.explain{margin-top:10px;padding:10px;background:#1e3a5f;border-radius:10px;font-size:13px;border-left:4px solid #f9c63a}.ribbon{position:absolute;top:10px;right:-28px;background:#ef4444;color:#fff;padding:3px 36px;font-size:10px;font-weight:800;transform:rotate(35deg)}</style></head><body><header><img class="logo" src="IMG-20261102-WA7822.jpg"><h>STEM <span>BLOCKS ACADEMY</span><small>⭐ TRUSTED • KCSE & KJSEA • KISII & BOMET</small></h></header><div id="tab-exams" class="tab on"><div class="hero"><b>🚀 Learn Today, Lead Tomorrow</b><br><small style="color:#64748b">Real papers used by top schools</small><div class="hero-stats"><div class="stat"><b>2,340+</b><small>Students</small></div><div class="stat"><b>86%</b><small>Pass</small></div><div class="stat"><b>12+</b><small>Schools</small></div><div class="stat"><b>4.9★</b><small>Rating</small></div></div></div><div class="chips" id="chips"></div><div id="list"></div></div><div id="tab-leader" class="tab"><div class="card"><h2>🏆 Leaderboard</h2><div id="leaderList"></div><button class="btn btn-primary" onclick="switchTab('exams')">← Back</button></div></div><div id="tab-strands" class="tab"><div class="card"><h2>📚 Strands</h2><div id="strandList"></div></div></div><div id="tab-account" class="tab"><div class="card"><h2>👤 Account</h2><p>Exams: <span id="doneCount">0</span></p><p>Last: <span id="lastScore">-</span></p><button class="btn" onclick="localStorage.clear();location.reload()">Clear</button><button class="btn btn-primary" onclick="switchTab('exams')">Go Exams →</button></div></div><div class="bottom"><button class="btm on" id="btm-exams" onclick="switchTab('exams')">⏱<br>Exams</button><button class="btm" id="btm-leader" onclick="switchTab('leader')">📊<br>Leaderboard</button><button class="btm" id="btm-strands" onclick="switchTab('strands')">📚<br>Strands</button><button class="btm" id="btm-account" onclick="switchTab('account')">👤<br>Account</button></div><div id="exam"><div style="background:#f9c63a;color:#000;padding:10px;border-radius:10px;font-weight:900;text-align:center;position:sticky;top:0;display:flex;justify-content:space-between" id="tm"><span>⏱ 50:00</span><span id="progress">Q1/50</span></div><h2 id="et"></h2><p id="em" style="opacity:.8"></p><div id="eq"></div><button style="width:100%;padding:14px;background:#10b981;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:12px" onclick="sub()">✅ Submit</button><button style="width:100%;padding:12px;background:#334155;color:#fff;border:none;border-radius:12px;margin-top:8px" onclick="closeE()">❌ Exit</button></div><script src="app.js"></script><script>
function switchTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.btm').forEach(b=>b.classList.remove('on'));document.getElementById('tab-'+n).classList.add('on');document.getElementById('btm-'+n).classList.add('on');if(n=='leader')drawLeader();if(n=='strands')drawStrands();if(n=='account')drawAccount();window.scrollTo(0,0);}
var grades=[{g:"All",label:"🌟 All"},{g:"G7",label:"🔢 G7"},{g:"G9",label:"🎓 G9"}];var curG="All",cur=null,sc=0,sec=0,ti=null,curQs=[],fails=[],answered=0;
function drawChips(){var h="";grades.forEach(g=>{h+='<button class="chip '+(curG==g.g?'on':'')+'" onclick="setG(\''+g.g+'\')">'+g.label+'</button>';});document.getElementById('chips').innerHTML=h;}
function setG(g){curG=g;drawChips();drawList();}
function drawList(){var h="";EX.forEach((e,i)=>{if(curG!="All"&&("G"+e.g)!=curG)return;h+='<div class="card">'+(e.ribbon?'<div class="ribbon">'+e.ribbon+'</div>':'')+'<div style="display:flex;gap:10px"><img src="IMG-20261102-WA7822.jpg" style="width:32px;height:32px;border-radius:50%"><b>'+e.t+'</b></div><div style="margin-top:8px"><span class="badge '+e.c+'">'+e.b+'</span></div><div style="color:#64748b;font-size:12px;margin-top:6px">⏱ '+e.tm+' 📝 '+e.qs+' Qs 👥 '+e.par+'</div><button class="btn btn-primary" onclick="openE('+i+')">▶ Start Pro Exam</button></div>';});document.getElementById('list').innerHTML=h;}
function drawLeader(){var ls=localStorage.getItem('lastScore')||"0/50",lp=localStorage.getItem('lastPerc')||"0%";var d=[{n:"Brian K. Kisii",s:"48/50",p:"96%",b:"🥇"},{n:"Faith Bomet",s:"46/50",p:"92%",b:"🥈"},{n:"You",s:ls,p:lp,b:"⭐"},{n:"Kevin Kisii",s:"44/50",p:"88%",b:"🥉"}];var h="";d.forEach(x=>{h+='<div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #f1f5f9"><span>'+x.b+' '+x.n+'</span><span><b>'+x.s+'</b> '+x.p+'</span></div>';});document.getElementById('leaderList').innerHTML=h;}
function drawStrands(){var s=[{t:"🔢 G7 Numbers",d:"Fractions, Decimals, Equations - 50Qs",c:"#f9c63a",g:"G7"},{t:"🔧 G9 Production",d:"Tools, Safety, PPE - 50Qs",c:"#0b1e3a",g:"G9"},{t:"🔬 G9 Mixtures",d:"Filtration, Evaporation - 50Qs",c:"#10b981",g:"G9"}];var h="";s.forEach(x=>{h+='<div style="background:#fff;border-radius:16px;padding:14px;margin:10px;border-left:5px solid '+x.c+'"><b>'+x.t+'</b><br><small style="color:#64748b">'+x.d+'</small><br><button class="btn btn-primary" style="margin-top:8px;padding:8px" onclick="setG(\''+x.g+'\');switchTab(\'exams\')">Start →</button></div>';});document.getElementById('strandList').innerHTML=h;}
function drawAccount(){document.getElementById('doneCount').innerText=localStorage.getItem('doneCount')||0;document.getElementById('lastScore').innerText=localStorage.getItem('lastScore')||"-";}
function openE(i){cur=EX[i];document.getElementById('exam').style.display='block';document.getElementById('et').innerText=cur.t;document.getElementById('em').innerText=cur.s+' • 50Qs • Definition on fail';var qs=QB[cur.key];curQs=qs.slice(0,cur.qs);sc=0;fails=[];answered=0;var hh="";curQs.forEach((q,idx)=>{hh+='<div style="background:#102a52;padding:14px;border-radius:14px;margin:12px 0"><b>Q'+(idx+1)+'. '+q.q+'</b><br>';q.o.forEach((op,j)=>{hh+='<button class="opt" id="q'+idx+'_'+j+'" onclick="pick('+idx+','+j+','+q.a+')">'+String.fromCharCode(65+j)+'. '+op+'</button>';});hh+='<div id="exp'+idx+'" style="display:none"></div></div>';});document.getElementById('eq').innerHTML=hh;sec=parseInt(cur.tm)*60;clearInterval(ti);ti=setInterval(()=>{sec--;var m=Math.floor(sec/60),s=sec%60;document.getElementById('tm').innerHTML='<span>⏱ '+m+':'+(s<10?'0':'')+s+'</span><span id="progress">✓ '+answered+'/'+curQs.length+'</span>';if(sec<=0)sub();},1000);}
function pick(qi,ch,co){var q=curQs[qi];for(var k=0;k<4;k++){var b=document.getElementById('q'+qi+'_'+k);if(b)b.disabled=true;}var cb=document.getElementById('q'+qi+'_'+ch);var rb=document.getElementById('q'+qi+'_'+co);var ed=document.getElementById('exp'+qi);answered++;document.getElementById('progress').innerText='✓ '+answered+'/'+curQs.length;if(ch==co){cb.classList.add('correct');sc++;ed.style.display='block';ed.innerHTML='<div class="explain">✅ Correct! '+q.ex+'<br><small>📖 '+q.def+'</small></div>';}else{cb.classList.add('wrong');rb.classList.add('correct');fails.push(q);ed.style.display='block';ed.innerHTML='<div class="explain">❌ Wrong. Correct '+String.fromCharCode(65+co)+'. '+q.ex+'<br><small>📖 '+q.def+'</small></div>';}}
function sub(){clearInterval(ti);var tot=curQs.length;var perc=Math.round(sc/tot*100);localStorage.setItem('lastScore',sc+'/'+tot);localStorage.setItem('lastPerc',perc+'%');var done=parseInt(localStorage.getItem('doneCount')||0)+1;localStorage.setItem('doneCount',done);var msg='RESULTS\n'+cur.t+'\nScore: '+sc+'/'+tot+' ('+perc+'%)\n';if(fails.length>0){msg+='\nFAILED REVISE:\n';var u={};fails.forEach(f=>{if(!u[f.def]){u[f.def]=1;msg+='- '+f.def+'\n';}});}else{msg+='\nPerfect!';}alert(msg);document.getElementById('exam').style.display='none';switchTab('leader');}
function closeE(){clearInterval(ti);document.getElementById('exam').style.display='none';}
drawChips();drawList();drawLeader();drawStrands();
</script></body></html>
