<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Blocks Academy - Full Clickable</title>
<style>
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#f3f6fb;padding-bottom:80px}
header{background:#0b1e3a;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;padding:2px;border:2px solid #f9c63a;object-fit:cover}
h{font-weight:900;line-height:1.1}h span{color:#f9c63a}h small{display:block;font-size:11px;opacity:.8;font-weight:400}
.chips{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #eee}
.chip{padding:8px 14px;border-radius:20px;background:#eef2ff;color:#1e40af;font-weight:800;border:none;cursor:pointer;white-space:nowrap}
.chip.on{background:#0b1e3a;color:#fff}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 4px 12px #0001}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#15803d}
.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:800;margin-top:10px;cursor:pointer}
.btn-primary{background:#0b1e3a;color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #0b1e3a;display:flex;justify-content:space-around;padding:8px 0;z-index:50}
.btm{border:none;background:none;font-size:12px;font-weight:800;color:#64748b;cursor:pointer;padding:6px 14px;border-radius:12px}
.btm.on{color:#0b1e3a;background:#fef08a;border:1px solid #f9c63a}
.tab{display:none}.tab.on{display:block}
#exam{position:fixed;inset:0;background:#0b1e3a;color:#fff;padding:12px;display:none;z-index:99;overflow:auto}
.opt{width:100%;text-align:left;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #1e3a5f;background:#132a52;color:#fff;font-weight:600;cursor:pointer}
.opt.correct{background:#10b981!important}.opt.wrong{background:#ef4444!important}
.explain{margin-top:10px;padding:12px;background:#1e3a5f;border-radius:10px;font-size:13px;border-left:4px solid #f9c63a}
.leader-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #f1f5f9}
.strand-card{background:#fff;border-radius:16px;padding:14px;margin:10px;border-left:5px solid #f9c63a}
</style>
</head>
<body>
<header>
<img class="logo" src="IMG-20261102-WA7822.jpg">
<h>STEM <span>BLOCKS ACADEMY</span><small>Tap Bottom Tabs - All Clickable!</small></h>
</header>
<div class="chips" id="chips"></div>

<div id="tab-exams" class="tab on"><div id="list"></div></div>

<div id="tab-leader" class="tab">
<div class="card">
<h2>🏆 Leaderboard - Kisii & Bomet</h2>
<div id="leaderList"></div>
<button class="btn btn-primary" onclick="switchTab('exams')">← Back to Exams</button>
</div>
</div>

<div id="tab-strands" class="tab">
<div class="card">
<h2>📚 CBC Strands - Click to Start</h2>
<div id="strandList"></div>
</div>
</div>

<div id="tab-account" class="tab">
<div class="card">
<h2>👤 My Account</h2>
<p><b>Name:</b> STEM Student</p>
<p><b>Exams Done:</b> <span id="doneCount">0</span></p>
<p><b>Last Score:</b> <span id="lastScore">-</span></p>
<p><b>Average:</b> <span id="avgScore">0%</span></p>
<button class="btn" onclick="localStorage.clear();alert('Data cleared!');location.reload()">🗑️ Clear My Data</button>
<button class="btn btn-primary" onclick="switchTab('exams')">Go to Exams →</button>
</div>
</div>

<div class="bottom">
<button class="btm on" id="btm-exams" onclick="switchTab('exams')">⏱<br>Exams</button>
<button class="btm" id="btm-leader" onclick="switchTab('leader')">📊<br>Leaderboard</button>
<button class="btm" id="btm-strands" onclick="switchTab('strands')">📚<br>Strands</button>
<button class="btm" id="btm-account" onclick="switchTab('account')">👤<br>Account</button>
</div>

<div id="exam">
<div style="background:#f9c63a;color:#000;padding:12px;border-radius:10px;font-weight:900;text-align:center;position:sticky;top:0" id="tm">⏱ 50:00</div>
<h2 id="et"></h2>
<p id="em" style="opacity:.8;font-size:13px"></p>
<div id="eq"></div>
<button style="width:100%;padding:14px;background:#10b981;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:14px" onclick="sub()">✅ Submit Exam</button>
<button style="width:100%;padding:12px;background:#334155;color:#fff;border:none;border-radius:12px;margin-top:8px" onclick="closeE()">❌ Exit</button>
</div>

<script>
function switchTab(name){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
document.querySelectorAll('.btm').forEach(b=>b.classList.remove('on'));
document.getElementById('tab-'+name).classList.add('on');
document.getElementById('btm-'+name).classList.add('on');
if(name=='leader')drawLeader();
if(name=='strands')drawStrands();
if(name=='account')drawAccount();
window.scrollTo(0,0);
}
