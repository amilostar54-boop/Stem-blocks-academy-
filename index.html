<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEM Blocks Academy</title><style>*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;background:#f3f6fb;padding-bottom:80px}header{background:#0b1e3a;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}h{font-weight:900;line-height:1.1}h span{color:#f9c63a}h small{display:block;font-size:11px;opacity:.8;font-weight:400}.logo{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;border:2px solid #f9c63a;object-fit:cover}.chips{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff}.chip{padding:8px 14px;border-radius:20px;background:#eef2ff;color:#1e40af;font-weight:800;border:none}.chip.on{background:#0b1e3a;color:#fff}.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 4px 12px #0001}.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#15803d}.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:800;margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0}.btm{border:none;background:none;font-size:11px;font-weight:700;color:#64748b}.btm.on{color:#1d4ed8}#exam{position:fixed;inset:0;background:#0b1e3a;color:#fff;padding:12px;display:none;z-index:99;overflow:auto}.opt{width:100%;text-align:left;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #1e3a5f;background:#132a52;color:#fff;font-weight:600}.opt.correct{background:#10b981!important;border-color:#10b981}.opt.wrong{background:#ef4444!important;border-color:#ef4444}.explain{margin-top:8px;padding:10px;background:#1e3a5f;border-radius:10px;font-size:13px;border-left:4px solid #f9c63a}</style><header><img class="logo" src="IMG-20261102-WA7822.jpg"><h>STEM <span>BLOCKS ACADEMY</span><small>Learn Today, Lead Tomorrow</small></h></header><div class="chips" id="chips"></div><div id="list"></div><div class="bottom"><button class="btm on">⏱<br>Exams</button><button class="btm">📊<br>Leaderboard</button><button class="btm">📚<br>Strands</button><button class="btm">👤<br>Account</button></div><div id="exam"><div style="background:#f9c63a;color:#000;padding:10px;border-radius:10px;font-weight:900;text-align:center;position:sticky;top:0;z-index:5" id="tm">⏱ 40:00</div><h2 id="et"></h2><p id="em" style="opacity:.8;font-size:13px"></p><div id="eq"></div><button style="width:100%;padding:14px;background:#10b981;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:14px" onclick="sub()">✅ Submit Exam</button><button style="width:100%;padding:12px;background:#334155;color:#fff;border:none;border-radius:12px;margin-top:8px" onclick="closeE()">❌ Exit</button></div><script>
var EX=[
{t:"FINAL LAP KJSEA 2026 PRETECH MUST COME",s:"Pretechnical Studies",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"50m",qs:10,par:86,str:"Production & Tools",key:"pretech"},
{t:"INT SCI PAPER 2 KJSEA MUST COME",s:"Integrated Science",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"40m",qs:10,par:95,str:"Mixtures & Separation",key:"science"},
{t:"CRE FINAL PREDICTION 50 MOST TESTED",s:"CRE",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"50m",qs:10,par:91,str:"Christian Values",key:"cre"},
{t:"MATH G7 NUMBERS EXAM",s:"Mathematics",g:"7",b:"LIVE",c:"b-green",tm:"30m",qs:10,par:120,str:"Numbers",key:"math7"}
];

var QB={
pretech:[
{q:"Which tool is used for measuring length?",o:["Try square","Tape measure","Chisel","Mallet"],a:1,ex:"Tape measure measures length accurately.",def:"Measuring: Finding size, length or amount of something."},
{q:"What is safety in workshop?",o:["Wearing open shoes","Ignoring goggles","Wearing PPE, keeping tools safe","Running in workshop"],a:2,ex:"PPE prevents injuries from sharp tools and dust.",def:"Workshop Safety: Rules to prevent accidents."},
{q:"Which material is soft wood?",o:["Mvule","Pine","Mahogany","Oak"],a:1,ex:"Pine is softwood, easy to cut.",def:"Softwood: Light wood from conifer trees, easy to work."},
{q:"First step in production?",o:["Finishing","Design / Sketch","Assembly","Selling"],a:1,ex:"You must design before you make.",def:"Production: Steps of making a product from design to finish."},
{q:"What does a bench vice do?",o:["Cut wood","Hold work firmly","Measure","Drill"],a:1,ex:"Vice holds material so it doesn't move.",def:"Holding tools: Tools that grip work."}
],
science:[
{q:"How to separate salt from water?",o:["Filtration","Evaporation","Decanting","Sieving"],a:1,ex:"Water evaporates leaving salt behind.",def:"Evaporation: Liquid changes to vapour when heated."},
{q:"What is a mixture?",o:["One substance only","Two or more substances mixed, not chemically joined","New substance formed","Only liquids"],a:1,ex:"In mixtures components keep their properties.",def:"Mixture: Combination of substances that can be separated physically."},
{q:"Which is filtration used for?",o:["Salt+water","Sand+water","Sugar+water","Oil+water"],a:1,ex:"Sand does not dissolve, stays on filter paper.",def:"Filtration: Separating solid that does not dissolve."},
{q:"Distillation separates based on?",o:["Colour","Boiling point","Weight","Size"],a:1,ex:"Different liquids boil at different temps.",def:"Boiling point: Temperature when liquid boils."}
],
cre:[
{q:"First book of Bible?",o:["Exodus","Genesis","Matthew","Psalms"],a:1,ex:"Genesis means beginning.",def:"Creation: God made world in Genesis 1."},
{q:"What did Jesus teach about forgiveness?",o:["Never forgive","Forgive 70x7 times","Revenge","Ignore"],a:1,ex:"Matthew 18:22 says forgive 70 times 7.",def:"Forgiveness: Letting go of anger, like God forgives us."},
{q:"Good Samaritan teaches?",o:["Help only friends","Love your neighbour even enemies","Keep money","Run away"],a:1,ex:"Samaritan helped a stranger who was hurt.",def:"Neighbourly love: Helping anyone in need."}
],
math7:[
{q:"25% of 200?",o:["25","50","40","60"],a:1,ex:"25% = 1/4, 1/4 of 200 = 50.",def:"Percentage: Part per hundred."},
{q:"12 x 8?",o:["84","96","88","108"],a:1,ex:"12x8=96",def:"Multiplication: Repeated addition."},
{q:"LCM of 4 and 6?",o:["12","24","6","8"],a:0,ex:"Multiples of 4:4,8,12; 6:6,12 => 12",def:"LCM: Smallest number divisible by both."}
]
};

var grades=["All","G7","G8","G9"];var curG="All",cur=null,sc=0,sec=0,ti=null,curQs=[],fails=[];

function drawChips(){var h="";grades.forEach(function(g){h+='<button class="chip '+(curG==g?'on':'')+'" onclick="setG(\''+g+'\')">'+g+'</button>'});document.getElementById('chips').innerHTML=h}
function setG(g){curG=g;drawChips();drawList()}
function drawList(){var h="";EX.forEach(function(e,i){if(curG!="All"&&("G"+e.g)!=curG)return;h+='<div class="card"><div style="display:flex;align-items:center;gap:8px"><img src="IMG-20261102-WA7822.jpg" style="width:32px;height:32px;border-radius:50%"><b>'+e.t+'</b></div><div class="badge '+e.c+'">'+e.b+'</div><div style="color:#64748b;font-size:13px">'+e.s+' • Grade '+e.g+' • '+e.str+'</div><div style="color:#64748b;font-size:13px;margin-top:6px">⏱ '+e.tm+' 📝 '+e.qs+' Qs 📊 '+e.par+' participants</div><button class="btn" onclick="openE('+i+')">Leaderboard → Start Exam →</button></div>'});document.getElementById('list').innerHTML=h}

function openE(i){
cur=EX[i];document.getElementById('exam').style.display='block';document.getElementById('et').innerText=cur.t;document.getElementById('em').innerText=cur.s+' • Grade '+cur.g+' • Strand: '+cur.str;
var qs=QB[cur.key]||QB.pretech;curQs=qs.slice(0,cur.qs);sc=0;fails=[];var hh="";
curQs.forEach(function(q,idx){
hh+='<div style="background:#102a52;padding:14px;border-radius:12px;margin:12px 0"><b>Q'+(idx+1)+'. '+q.q+'</b><br>';
q.o.forEach(function(op,j){hh+='<button class="opt" id="q'+idx+'_'+j+'" onclick="pick('+idx+','+j+','+q.a+')">'+String.fromCharCode(65+j)+'. '+op+'</button>'});
hh+='<div id="exp'+idx+'" style="display:none"></div></div>';
});
document.getElementById('eq').innerHTML=hh;
sec=parseInt(cur.tm)*60;clearInterval(ti);ti=setInterval(function(){sec--;var m=Math.floor(sec/60),s=sec%60;document.getElementById('tm').innerText='⏱ '+m+':'+(s<10?'0':'')+s;if(sec<=0)sub()},1000);
}

function pick(qi,chosen,correct){
var q=curQs[qi];
for(var k=0;k<4;k++){var btn=document.getElementById('q'+qi+'_'+k);if(btn)btn.disabled=true;}
var chosenBtn=document.getElementById('q'+qi+'_'+chosen);
var correctBtn=document.getElementById('q'+qi+'_'+correct);
var expDiv=document.getElementById('exp'+qi);
if(chosen==correct){
chosenBtn.classList.add('correct');sc++;
expDiv.style.display='block';expDiv.innerHTML='<div class="explain">✅ <b>Correct!</b> '+q.ex+'<br><small><b>Definition:</b> '+q.def+'</small></div>';
}else{
chosenBtn.classList.add('wrong');correctBtn.classList.add('correct');fails.push(q);
expDiv.style.display='block';expDiv.innerHTML='<div class="explain">❌ <b>Wrong.</b> Correct is '+String.fromCharCode(65+correct)+'. '+q.ex+'<br><small><b>Definition:</b> '+q.def+'</small><br><small><b>Remember:</b> '+q.def+'</small></div>';
}
}

function sub(){
clearInterval(ti);
var tot=curQs.length;var perc=Math.round(sc/tot*100);
var msg='RESULTS OUT\n'+cur.t+'\nScore: '+sc+'/'+tot+' ('+perc+'%)\n';
if(fails.length>0){msg+='\nFAILED TOPICS TO REVISE:\n';fails.forEach(function(f){msg+='- '+f.def+'\n';});}else{msg+='\nExcellent! No failures!';}
alert(msg);
document.getElementById('exam').style.display='none';
}
function closeE(){clearInterval(ti);document.getElementById('exam').style.display='none';}
drawChips();drawList();
</script>
