<!DOCTYPE html><html><head><meta charset="UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>G1-12</title><style>body{margin:0;font-family:sans-serif;background:#f1f5f9}#p{position:fixed;inset:0;background:#0f172a;z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}.c{background:#fff;padding:18px;border-radius:14px;max-width:360px;width:100%;text-align:center}.b{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:8px}input{width:100%;padding:10px;border:2px solid #333;border-radius:8px;margin-top:6px;box-sizing:border-box}#m{max-width:900px;margin:auto;padding:10px;display:none}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gr{padding:12px;background:#fff;border:2px solid #2563eb;border-radius:8px;text-align:center;font-weight:bold}.s{background:#fff;padding:12px;border-radius:10px;margin-top:8px}.q{margin:6px 0;padding:8px;background:#f8fafc;border:1px solid #ddd;border-radius:6px}</style></head><body>
<div id=p><div class=c><h3>Grade 1-12 Academy</h3><p>100KES Pochi <b style=color:green>0707905752</b></p><input id=n value="Abraham"><input id=k value=STEMKISII100><button class=b onclick="p.style.display='none';m.style.display='block'">UNLOCK GRADES</button></div></div>
<div id=m><h2 style=text-align:center;background:#2563eb;color:#fff;padding:12px;border-radius:10px>🎓 Select Grade 1-12</h2><div id=gg class=g></div><div id=area style=display:none><button class=b style=background:#64748b onclick="area.style.display='none';gg.style.display='grid'">⬅ Back to Grades</button><h3 id=gt></h3><div id=sub></div></div></div>
<script>
let pt=0;let gg=document.getElementById('gg');for(let i=1;i<=12;i++)gg.innerHTML+=`<div class=gr onclick="sel(${i})">Grade ${i}</div>`;
function sel(n){gg.style.display='none';let a=document.getElementById('area');a.style.display='block';document.getElementById('gt').innerText='Grade '+n+' Subjects';let subs=n<=6?['Mathematics','English','Kiswahili','Science']:['Mathematics','English','Kiswahili','Biology','Chemistry','Physics'];let h='';subs.forEach(s=>{let id=s.replace(/\s/g,'');h+=`<div class=s><b>${s}</b><br><button onclick="exam('${id}')" style=background:#10b981;color:#fff;border:none;padding:8px;border-radius:6px;margin-top:4px>Take Exam - Auto Marked</button><div id="${id}-e" style=display:none></div></div>`});document.getElementById('sub').innerHTML=h}
let bank={Mathematics:{q:[{t:"12x8=?",o:["96","84"],a:0},{t:"2x=10 x?",o:["5","2"],a:0},{t:"Triangle sides?",o:["3","4"],a:0}]},default:{q:[{t:"2+2=?",o:["4","3"],a:0},{t:"Capital Kenya?",o:["Nairobi","Kisii"],a:0},{t:"Sky color?",o:["Blue","Red"],a:0}]}};
function exam(s){let d=document.getElementById(s+'-e');if(d.style.display=='block'){d.style.display='none';return;}let ex=bank[s]||bank.default;let h='';ex.q.forEach((qq,i)=>{h+=`<div class=q id="${s}-q${i}"><b>Q${i+1}:${qq.t}</b><br>`;qq.o.forEach((op,j)=>{h+=`<label><input type=radio name="${s}${i}" value=${j}> ${op}</label><br>`});h+=`</div>`});h+=`<button onclick="mark('${s}')" style=background:#2563eb;color:#fff;border:none;padding:8px;border-radius:6px>Submit Mark</button><div id="${s}-r"></div>`;d.innerHTML=h;d.style.display='block'}
function mark(s){let ex=bank[s]||bank.default;let sc=0;ex.q.forEach((qq,i)=>{let sel=document.querySelector(`input[name="${s}${i}"]:checked`);let qd=document.getElementById(`${s}-q${i}`);if(sel){let v=parseInt(sel.value);if(v==qq.a){sc++;qd.style.background='#dcfce7'}else qd.style.background='#fee2e2'}});document.getElementById(s+'-r').innerHTML=`<h3>Score ${sc}/${ex.q.length} MARKED! +${sc*2}pts</h3>`}
</script></body></html>
