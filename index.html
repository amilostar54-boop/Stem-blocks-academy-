<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>G1-12 Fixed</title><style>body{margin:0;font-family:sans-serif;background:#f1f5f9}#p{position:fixed;inset:0;background:#0f172a;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px}.c{background:#fff;padding:14px;border-radius:12px;max-width:320px;width:100%;text-align:center}.b{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:6px}input{width:100%;padding:10px;border:2px solid #333;border-radius:8px;margin-top:6px}#m{max-width:900px;margin:auto;padding:8px;display:none}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gr{padding:12px;background:#fff;border:2px solid #2563eb;border-radius:10px;text-align:center;font-weight:bold;cursor:pointer}.gr:active{background:#dbeafe}.s{background:#fff;padding:12px;border-radius:10px;margin-top:8px}.q{padding:8px;background:#f8fafc;border:1px solid #ddd;border-radius:6px;margin:5px 0}</style></head><body>
<div id=p><div class=c><h3>🎓 G1-12 Fixed</h3><p>Pochi <b style=color:green>0707905752</b></p><button class=b onclick="document.getElementById('p').style.display='none';document.getElementById('m').style.display='block'">UNLOCK - TAP HERE</button></div></div>
<div id=m><h2 style=text-align:center;background:#2563eb;color:#fff;padding:10px;border-radius:10px>STEM Academy - Kisii/Bomet</h2><h3>👇 Chagua Grade Yako (1-12)</h3><div id=gg class=g></div><div id=area style=display:none><button class=b style=background:#64748b onclick="document.getElementById('area').style.display='none';document.getElementById('gg').style.display='grid'">⬅ Back to Grades</button><h3 id=gt></h3><div id=sub></div></div></div>
<script>
function calc(){let e=prompt('🧮 Calculator - Type like 12*8 or 200*0.15');if(e){try{let r=eval(e);alert(e+' = '+r)}catch{alert('Error - try 12*8')}}}
let d=document.getElementById('gg');for(let i=1;i<=12;i++){let b=document.createElement('div');b.className='gr';b.innerText='Grade '+i;b.onclick=function(){sel(i)};d.appendChild(b)}
function sel(n){document.getElementById('gg').style.display='none';let a=document.getElementById('area');a.style.display='block';document.getElementById('gt').innerText='Grade '+n+' - Subjects + 🧮 Calculator Inside';let subs=n<=6?['Mathematics','English','Kiswahili','Science']:['Mathematics','English','Kiswahili','Biology','Chemistry','Physics'];let h='';subs.forEach(function(s){let id=s.replace(/\W/g,'');h+='<div class=s><b>'+s+' G'+n+'</b> <button onclick="calc()" style=background:#f59e0b;color:#fff;border:none;border-radius:4px;padding:3px 8px>🧮 Calc</button><br><button onclick="exam(\''+id+'\')" style=background:#10b981;color:#fff;border:none;padding:7px;border-radius:5px;margin-top:5px>Take Exam + Calc + Auto Mark</button><div id="'+id+'-e" style=display:none></div></div>'});document.getElementById('sub').innerHTML=h}
let bank={Mathematics:{q:[{t:"12*8=? Use 🧮",o:["96","84"],a:0},{t:"15% of 200? 200*0.15",o:["30","15"],a:0},{t:"(5+3)*2=?",o:["16","8"],a:0}]},default:{q:[{t:"2+2=?",o:["4","3"],a:0},{t:"10*5=? 🧮",o:["50","15"],a:0},{t:"100/4=?",o:["25","20"],a:0}]}};
function exam(s){let e=document.getElementById(s+'-e');if(e.style.display=='block'){e.style.display='none';return;}let ex=bank[s]||bank.default;let h='';ex.q.forEach(function(qq,i){h+='<div class=q id="'+s+'-q'+i+'"><b>Q'+(i+1)+': '+qq.t+'</b> <button onclick="calc()" style=background:#f59e0b;color:#fff;border:none;border-radius:3px;font-size:11px>🧮</button><br>';qq.o.forEach(function(op,j){h+='<label><input type=radio name="'+s+i+'" value='+j+'> '+op+'</label><br>'});h+='</div>'});h+='<button onclick="mark(\''+s+'\')" style=background:#2563eb;color:#fff;border:none;padding:7px;border-radius:5px>Submit Mark</button><div id="'+s+'-r"></div>';e.innerHTML=h;e.style.display='block'}
function mark(s){let ex=bank[s]||bank.default;let sc=0;ex.q.forEach(function(qq,i){let sel=document.querySelector('input[name="'+s+i+'"]:checked');let qd=document.getElementById(s+'-q'+i);if(sel){let v=parseInt(sel.value);if(v==qq.a){sc++;qd.style.background='#dcfce7'}else qd.style.background='#fee2e2'}});document.getElementById(s+'-r').innerHTML='<b>'+sc+'/'+ex.q.length+' MARKED! +'+(sc*10)+'pts - Calc helped!</b>'}
</script></body></html>
