<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Blocks Academy | Kisii-Bomet | Pro CBC Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#f8fafc;color:#0f172a}
header{background:#0f172a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo span{color:#38bdf8}
.hero{background:linear-gradient(135deg,#1e40af,#06b6d4);color:#fff;padding:28px 18px;border-radius:0 0 28px 28px;text-align:center}
.hero h1{margin:0;font-size:26px;line-height:1.2}
.hero p{opacity:.9;margin:10px 0 14px}
.btn{border:none;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}
.btnW{background:#fff;color:#1e40af}
.btnB{background:#1e40af;color:#fff;width:100%}
.btnG{background:#10b981;color:#fff;width:100%}
.btnO{background:#f59e0b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px}
.cardG{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;text-align:center;box-shadow:0 4px 12px #0000a;transition:.15s;cursor:pointer}
.cardG:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0001}
.cardG b{font-size:22px}
.badge{background:#dbeafe;color:#1e40af;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}
.wrap{padding:14px}
.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0000a;border:1px solid #e2e8f0}
.strand{border-left:5px solid #1e40af}
.sub{border-left:5px solid #10b981}
.topBar{display:flex;gap:8px;margin:10px 0}
.chip{padding:8px 12px;border-radius:20px;background:#e0e7ff;color:#3730a3;font-weight:700;font-size:12px}
#examBox{display:none;position:fixed;inset:0;background:#0f172a;z-index:20;padding:14px;overflow:auto;color:#fff}
.q{background:#1e293b;padding:14px;border-radius:14px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}
.opt:hover{background:#1e40af}
.timer{position:sticky;top:0;background:#f59e0b;color:#000;padding:10px;border-radius:10px;font-weight:800;text-align:center}
.calc{position:fixed;right:12px;bottom:12px;background:#f59e0b;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;box-shadow:0 6px 18px #0003;cursor:pointer;z-index:15}
</style>
