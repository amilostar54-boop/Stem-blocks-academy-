<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEM Blocks Academy</title><style>*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;background:#f3f6fb;padding-bottom:80px}header{background:#0b1e3a;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}h{font-weight:900;line-height:1.1}h span{color:#f9c63a}h small{display:block;font-size:11px;opacity:.8;font-weight:400}.logo{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;border:2px solid #f9c63a;object-fit:cover}.chips{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff}.chip{padding:8px 14px;border-radius:20px;background:#eef2ff;color:#1e40af;font-weight:800;border:none}.chip.on{background:#0b1e3a;color:#fff}.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 4px 12px #0001}.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#15803d}.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:800;margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0}.btm{border:none;background:none;font-size:11px;font-weight:700;color:#64748b}.btm.on{color:#1d4ed8}#exam{position:fixed;inset:0;background:#0b1e3a;color:#fff;padding:12px;display:none;z-index:99;overflow:auto}.opt{width:100%;text-align:left;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #1e3a5f;background:#132a52;color:#fff}</style><header><img class="logo" src="IMG-20261102-WA7822.jpg"><h>STEM <span>BLOCKS ACADEMY</span><small>Learn Today, Lead Tomorrow - Kisii & Bomet</small></h></header><div class="chips" id="chips"></div><div id="list"></div><div class="bottom"><button class="btm on">⏱<br>Exams</button><button class="btm">📊<br>Leaderboard</button><button class="btm">📚<br>Strands</button><button class="btm">👤<br>Account</button></div><div id="exam"><div style="background:#f9c63a;color:#000;padding:10px;border-radius:10px;font-weight:900;text-align:center" id="tm">⏱ 40:00</div><h2 id="et"></h2><div id="eq"></div><button style="width:100%;padding:14px;background:#10b981;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:10px" onclick="sub()">✅ Submit</button><button style="width:100%;padding:12px;background:#334155;color:#fff;border:none;border-radius:12px;margin-top:8px" onclick="exam.style.display='none'">❌ Exit</button></div><script>var EX=[{t:"FINAL LAP KJSEA 2026 PRETECH MUST COME",s:"Pretechnical",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"50m",qs:50,par:86},{t:"INT SCI PAPER 2 KJSEA MUST COME",s:"Integrated Sci",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"40m",qs:60,par:95},{t:"CRE FINAL PREDICTION 50 MOST TESTED",s:"CRE",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"50m",qs:50,par:91},{t:"MATH G7 NUMBERS EXAM",s:"Math",g:"7",b:"LIVE",c:"b-green",tm:"30m",qs:40,par:120},{t:"MATH G9 NUMBERS & ALGEBRA FINAL LAP",s:"Math",g:"9",b:"NEW",c:"b-blue",tm:"45m",qs:60,par:112}];var grades=["All","G1","G2","G7","G8","G9","G10","G12"];var curG="All";function drawChips(){var h="";grades.forEach(function(g){h+='<button class="chip '+(curG==g?'on':'')+'" onclick="setG(\''+g+'\')">'+g+'</button>'});document.getElementById('chips').innerHTML=h}function setG(g){curG=g;drawChips();drawList()}function drawList(){var h="";EX.forEach(function(e,i){h+='<div class="card"><div style="display:flex;align-items:center;gap:8px"><img src="IMG-20261102-WA7822.jpg" style="width:32px;height:32px;border-radius:50%"><b>'+e.t+'</b></div><div class="badge '+e.c+'">'+e.b+'</div><div style="color:#64748b;font-size:13px">'+e.s+' • Grade '+e.g+'</div><div style="color:#64748b;font-size:13px;margin-top:6px">⏱ '+e.tm+' 📝 '+e.qs+' Qs</div><button class="btn" onclick="openE('+i+')">Start Exam →</button></div>'});document.getElementById('list').innerHTML=h}function openE(i){cur=EX[i];document.getElementById('exam').style.display='block';document.getElementById('et').innerText=cur.t;document.getElementById('eq').innerHTML='<p>Exam: '+cur.qs+' questions</p><button class="opt">A. Option</button><button class="opt">B. Option</button>';}function sub(){alert('Submitted!');document.getElementById('exam').style.display='none'}drawChips();drawList();</script>
