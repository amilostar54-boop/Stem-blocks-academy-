<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>G1-12 Calc</title><style>body{margin:0;font-family:sans-serif;background:#f1f5f9}#p{position:fixed;inset:0;background:#0f172a;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px}.c{background:#fff;padding:14px;border-radius:12px;max-width:320px;width:100%;text-align:center}.b{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:6px}#m{max-width:900px;margin:auto;padding:8px;display:none}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.gr{padding:10px;background:#fff;border:2px solid #2563eb;border-radius:8px;text-align:center;font-weight:bold}.s{background:#fff;padding:10px;border-radius:8px;margin-top:6px}.q{padding:6px;background:#f8fafc;border:1px solid #ddd;border-radius:6px;margin:4px 0}</style></head><body>
<div id=p><div class=c><h3>🎓 G1-12 + 🧮 Calc Inside</h3><p>Pochi <b style=color:green>0707905752</b></p><button class=b onclick="p.style.display='none';m.style.display='block'">UNLOCK GRADES</button></div></div>
<div id=m><h2 style=text-align:center;background:#2563eb;color:#fff;padding:8px;border-radius:8px>Select Grade 1-12</h2><div id=gg class=g></div><div id=area style=display:none><button class=b style=background:#64748b onclick="area.style.display='none';gg.style.display='grid'">⬅ Grades</button><h3 id=gt></h3><div id=sub></div></div></div>
<script>
let gg=document.getElementById('gg');for(let i=1;i<=12;i++)gg.innerHTML+=`<div class=gr onclick="sel(${i})">G${i}</div>`;
function calc(){let e=prompt('🧮 Calculator - Type e.g. 12*8 or 200*0.15');if(e){try{alert(e+' = '+eval(e))}catch{alert('Error')}}}
function sel(n){gg.style.display='none';area.style.display='block';gt.innerText='Grade '+n+' - 🧮 Calculator Inside Everything';let subs=n<=6?['Math','English','Kiswahili','Science']:['Math','English','Kiswahili','Bio','Chem','Physics'];let h='';subs.forEach(s=>{let id=s.replace(/\W/g,'');h+=`<div class=s><b>${s} G${n}</b> <button onclick="calc()" style=background:#f59e0b;color:#fff;border:none;border-radius:3px;padding:2px 6px>🧮 Calc</button><br><button onclick="exam('${id}')" style=background:#10b981;color:#fff;border:none;padding:6px;border-radius:4px;margin-top:4px>Exam + Calc + Auto Mark</button><div id="${id}-e" style=display:none></div></div>`});sub.innerHTML=h}
let bank={Math:{q:[{t:"12*8=? Use 🧮",o:["96","84"],a:0},{t:"15% of 200? calc 200*0.15",o:["30","15"],a:0},{t:"(5+3)*2=?",o:["16","8"],a:0}]},default:{q:[{t:"2+2=?",o:["4","3"],a:0},{t:"10*5=? 🧮",o:["50","15"],a:0},{t:"100/4=?",o:["25","20"],a:0}]}};
function exam(s){let d=document.getElementById(s+'-e');if(d.style.display=='block'){d.style.display='none';return;}let ex=bank[s]||bank.default;let h='';ex.q.forEach((qq,i)=>{h+=`<div class=q id="${s}-q${i}"><b>Q${i+1}:${qq.t}</b> <button onclick="calc()" style=background:#f59e0b;color:#fff;border:none;border-radius:3px;font-size:10px>🧮</button><br>`;qq.o.forEach((op,j)=>{h+=`<label><input type=radio name="${s}${i}" value=${j}> ${op}</label><br>`});h+=`</div>`});h+=`<button onclick="mark('${s}')" style=background:#2563eb;color:#fff;border:none;padding:6px;border-radius:4px>Submit Mark</button><div id="${s}-r"></div>`;d.innerHTML=h;d.style.display='block'}
function mark(s){let ex=bank[s]||bank.default;let sc=0;ex.q.forEach((qq,i)=>{let sel=document.querySelector(`input[name="${s}${i}"]:checked`);let qd=document.getElementById(`${s}-q${i}`);if(sel){let v=parseInt(sel.value);if(v==qq.a){sc++;qd.style.background='#dcfce7'}else qd.style.background='#fee2e2'}});document.getElementById(s+'-r').innerHTML=`<b>${sc}/${ex.q.length} MARKED! +${sc*10}pts 🧮 Calc used!</b>`}
</script></body></html>
