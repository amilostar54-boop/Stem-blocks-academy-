<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEM V3 FIXED</title><style>body{margin:0;font-family:sans-serif;background:#f1f5f9}#paywall{position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#fff;padding:22px;border-radius:16px;max-width:380px;width:100%;text-align:center}.mpesa{background:#f0fdf4;border:2px solid #10b981;padding:10px;border-radius:10px;margin:10px 0;text-align:left}.btn{width:100%;padding:15px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}.btn2{padding:10px 14px;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}input{width:100%;padding:12px;border:2px solid #333;border-radius:8px;margin-top:8px;box-sizing:border-box;font-size:16px}.content{max-width:900px;margin:0 auto;padding:10px}.header{background:#2563eb;color:#fff;padding:18px;border-radius:12px;text-align:center;margin-bottom:12px}.subj{background:#fff;padding:16px;border-radius:12px;margin-top:12px}.leader{background:#fffbeb;border:2px solid #f59e0b;padding:14px;border-radius:12px;margin-top:12px}.quizQ{margin:10px 0;padding:10px;background:#f8fafc;border:1px solid #ddd;border-radius:8px}#main{display:none}.correct{background:#dcfce7!important}.wrong{background:#fee2e2!important}</style></head><body>

<div id="main" class="content"><div class="header"><h1>🚀 STEM Blocks Academy V3</h1><p>Young Development Project African Ltd</p><p>Karibu <span id="uName">Abraham</span>!</p></div><div class="leader"><h3>🏆 Leaderboard - Compete!</h3><div id="board"></div><p>Points: <b id="myPts">0</b></p></div>
<div class="subj"><h3>📐 Mathematics</h3><button class="btn2" onclick="openExam('math')">▶️ Take Exam (Auto-Marked)</button><div id="math-exam" style="display:none"></div></div>
<div class="subj"><h3>🔬 Science</h3><button class="btn2" onclick="openExam('science')">▶️ Take Exam</button><div id="science-exam" style="display:none"></div></div>
<div class="subj"><h3>💻 Coding</h3><button class="btn2" onclick="openExam('coding')">▶️ Take Exam</button><div id="coding-exam" style="display:none"></div></div>
<div class="subj"><h3>🤖 Robotics</h3><button class="btn2" onclick="openExam('robotics')">▶️ Take Exam</button><div id="robotics-exam" style="display:none"></div></div></div>
<script>
let myPts=0;
const exams={math:{t:"Math",qs:[{q:"12x8=?",o:["96","84","88"],a:0},{q:"Square side5 area?",o:["10","25","20"],a:1},{q:"2x=10 x=?",o:["5","2","10"],a:0},{q:"Triangle sides?",o:["4","3","5"],a:1},{q:"15% of 200?",o:["30","15","25"],a:0}]},science:{t:"Science",qs:[{q:"Heart pumps?",o:["Blood","Water","Air"],a:0},{q:"Unit of electricity?",o:["Volt","Kg","Meter"],a:0},{q:"Plant food by?",o:["Photosynthesis","Respiration","Digestion"],a:0},{q:"Conductor?",o:["Copper","Plastic","Wood"],a:0},{q:"Oxygen for?",o:["Breathing","Seeing","Hearing"],a:0}]},coding:{t:"Coding",qs:[{q:"Scratch move?",o:["move 10 steps","go 10","walk"],a:0},{q:"Loop means?",o:["Repeat","Stop","Delete"],a:0},{q:"Python print()?",o:["Show output","Delete file","Error"],a:0},{q:"Condition uses?",o:["if","for","print"],a:0},{q:"Bug means?",o:["Error","Success","Game"],a:0}]},robotics:{t:"Robotics",qs:[{q:"Arduino is?",o:["Microcontroller","Game","Phone"],a:0},{q:"LED?",o:["Light Emitting Diode","Low Energy Device","Light Energy"],a:0},{q:"Sensor?",o:["Detect","Cook","Fly"],a:0},{q:"Robot brain?",o:["Microcontroller","Battery","Wheel"],a:0},{q:"Servo?",o:["Motion","Sound","Light"],a:0}]}};
function renderBoard(){let list=[{n:"Brian Kisii",p:38},{n:"Faith Bomet",p:35},{n:"Kevin Kericho",p:32},{n:document.getElementById('uName').innerText,p:myPts}];list.sort((a,b)=>b.p-a.p);let h="";list.forEach((u,i)=>{h+=`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #eee"><span>${i+1}. ${u.n}</span><b>${u.p} pts</b></div>`});document.getElementById('board').innerHTML=h;}
function openExam(sub){let div=document.getElementById(sub+'-exam');if(div.style.display==='block'){div.style.display='none';return;}let ex=exams[sub];let html=`<h4>${ex.t} Exam - Auto Marked</h4>`;ex.qs.forEach((qq,i)=>{html+=`<div class="quizQ" id="${sub}-q${i}"><b>Q${i+1}: ${qq.q}</b><br>`;qq.o.forEach((opt,j)=>{html+=`<label><input type=radio name="${sub}${i}" value="${j}"> ${opt}</label><br>`});html+=`</div>`});html+=`<button class="btn2" onclick="markExam('${sub}')">Submit & Mark</button><div id="${sub}-res"></div>`;div.innerHTML=html;div.style.display='block';}
function markExam(sub){let ex=exams[sub];let score=0;ex.qs.forEach((qq,i)=>{let sel=document.querySelector(`input[name="${sub}${i}"]:checked`);let qDiv=document.getElementById(`${sub}-q${i}`);if(sel){let v=parseInt(sel.value);if(v===qq.a){score++;qDiv.className="quizQ correct";}else qDiv.className="quizQ wrong";}});let pts=score*2;document.getElementById(sub+'-res').innerHTML=`<h3>Result: ${score}/${ex.qs.length} MARKED! +${pts} pts</h3>`;myPts+=pts;document.getElementById('myPts').innerText=myPts;renderBoard();}
</script></body></html>
