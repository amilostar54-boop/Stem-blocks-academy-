<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEM Blocks Academy</title><style>*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;background:#f3f6fb;padding-bottom:80px}header{background:#0b1e3a;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0}h{font-weight:900;line-height:1.1}h span{color:#f9c63a}h small{display:block;font-weight:400;font-size:11px;opacity:.8}.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;object-fit:cover}.chips{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #e5e7eb}.chip{padding:8px 14px;border-radius:20px;background:#eef2ff;color:#1e40af;font-weight:800;border:none}.chip.on{background:#0b1e3a;color:#fff}.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 4px 12px #0001}.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#15803d}.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:800;margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0}.btm{border:none;background:none;font-size:11px;font-weight:700;color:#64748b}.btm.on{color:#1d4ed8}#exam{position:fixed;inset:0;background:#0b1e3a;color:#fff;padding:12px;display:none;z-index:99;overflow:auto}.opt{width:100%;text-align:left;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #1e3a5f;background:#132a52;color:#fff}</style><header><img class="logo" src="https://i.ibb.co/5g8Y3v1Z/stem-logo.png" onerror="this.src='https://raw.githubusercontent.com/amilostar54-boop/Stem-blocks-academy-/main/logo.png'"><h>STEM <span>BLOCKS ACADEMY</span><small>Learn Today, Lead Tomorrow</small></h><div style="margin-left:auto">🔔 ☰</div></header><div class="chips" id="chips"></div><div id="list"></div><div class="bottom"><button class="btm on">⏱<br>Exams</button><button class="btm">📊<br>Leaderboard</button><button class="btm">📚<br>Strands</button><button class="btm">👤<br>Account</button></div><div id="exam"><div style="background:#f9c63a;color:#000;padding:10px;border-radius:10px;font-weight:900;text-align:center;position:sticky;top:0" id="tm">⏱ 40:00</div><h2 id="et"></h2><p id="em" style="opacity:.8;font-size:13px"></p><div id="eq"></div><button style="width:100%;padding:14px;background:#10b981;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:10px" onclick="sub()">✅ Submit</button><button style="width:100%;padding:12px;background:#334155;color:#fff;border:none;border-radius:12px;margin-top:8px" onclick="exam.style.display='none'">❌ Exit</button></div><script>
var EX=[{t:"FINAL LAP KJSEA 2026 PRETECH MUST COME",s:"Pretechnical Studies",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"50m",qs:50,par:86,str:"Production & Tools",subs:"Measuring, Cutting, Safety"},{t:"INT SCI PAPER 2 KJSEA MUST COME",s:"Integrated Science",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"40m",qs:60,par:95,str:"Mixtures & Separation",subs:"Filtration, Distillation"},{t:"CRE FINAL PREDICTION 50 MOST TESTED",s:"CRE",g:"9",b:"RESULTS OUT",c:"b-blue",tm:"50m",qs:50,par:91,str:"Christian Values",subs:"Creation, Miracles"},{t:"MATH G7 NUMBERS EXAM",s:"Mathematics",g:"7",b:"LIVE",c:"b-green",tm:"30m",qs:40,par:120,str:"Numbers",subs:"Whole Numbers"}];
var grades=["All","G1","G2","G7","G8","G9","G10","G12"];var curG="All",cur=null,sc=0,sec=0,ti=null,curQs=[];
var QB={def:[["12x8?","96","84","88","108","A"],["25% of 200?","50","25","40","60","A"]]};
function drawChips(){var h="";grades.forEach(function(g){h+='<button class="chip '+(curG==g?'on':'')+'" onclick="setG(\''+g+'\')">'+g+'</button>'});document.getElementById('chips').innerHTML=h}
function setG(g){curG=g;drawChips();drawList()}
function drawList(){var h="";EX.forEach(function(e,i){if(curG!="All"&&("G"+e.g)!=curG)return;h+='<div class="card"><div style="width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="https://i.ibb.co/5g8Y3v1Z/stem-logo.png" style="width:32px;height:32px;border-radius:50%" onerror="this.src=\'https://raw.githubusercontent.com/amilostar54-boop/Stem-blocks-academy-/main/logo.png\'"></div><div style="font-weight:900;margin-top:8px">'+e.t+'</div><div class="badge '+e.c+'">'+e.b+'</div><div style="color:#64748b;font-size:13px">'+e.s+' • Grade '+e.g+' • '+e.str+'</div><div style="color:#64748b;font-size:11px">Substrands: '+e.subs+'</div><div style="color:#64748b;font-size:13px;margin-top:6px">⏱ '+e.tm+' 📝 '+e.qs+' Qs 📊 '+e.par+' participants</div><button class="btn" onclick="openE('+i+')">Leaderboard → Start Exam →</button></div>'});document.getElementById('list').innerHTML=h}
function openE(i){cur=EX[i];document.getElementById('exam').style.display='block';document.getElementById('et').innerText=cur.t;document.getElementById('em').innerText=cur.s+' • Grade '+cur.g+' • Strand: '+cur.str;var base=QB.def;var all=[];while(all.length<cur.qs){all=all.concat(base)}all=all.slice(0,cur.qs);curQs=all;sc=0;var hh="";all.forEach(function(q,idx){hh+='<div style="background:#102a52;padding:14px;border-radius:12px;margin:10px 0"><b>Q'+(idx+1)+'. '+q[0]+'</b><br><button class="opt" onclick="pick(this,\''+q[5]+'\',\'A\')">A. '+q[1]+'</button><button class="opt" onclick="pick(this,\''+q[5]+'\',\'B\')">B. '+q[2]+'</button><button class="opt" onclick="pick(this,\''+q[5]+'\',\'C\')">C. '+q[3]+'</button><button class="opt" onclick="pick(this,\''+q[5]+'\',\'D\')">D. '+q[4]+'</button></div>'});document.getElementById('eq').innerHTML=hh;sec=parseInt(cur.tm)*60;clearInterval(ti);ti=setInterval(function(){sec--;var m=Math.floor(sec/60),s=sec%60;document.getElementById('tm').innerText='⏱ '+m+':'+(s<10?'0':'')+s;if(sec<=0)sub()},1000)}
function pick(el,ans,ch){el.style.background=ch==ans?'#10b981':'#ef4444';var ps=el.parentElement.querySelectorAll('.opt');for(var k=0;k<ps.length;k++)ps[k].disabled=true;if(ch==ans)sc++}
function sub(){clearInterval(ti);var tot=curQs.length;var p=Math.round(sc/tot*100);alert('RESULTS OUT\n'+cur.t+'\nScore: '+sc+'/'+tot+' ('+p+'%)');document.getElementById('exam').style.display='none'}
drawChips();drawList();
</script>
